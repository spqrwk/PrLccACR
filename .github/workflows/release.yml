name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.5.2.2"
        required: true
        default: "1.0.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ACR_AUTHOR: LccMch
  ACR_DESCRIPTION: LccMch - FFXIV 机工士 ACR 自动循环
  ACR_JOB: MCH
  ACR_CONTENT_SCOPE: Unspecified

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # 手动触发优先用输入的版本号；tag 触发用 tag 名
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          $parsedVersion = $null
          if (-not [System.Version]::TryParse($version, [ref]$parsedVersion)) {
            throw "Version '$version' is not a valid System.Version value."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Sync RotationMetadata version
        shell: pwsh
        run: |
          $path = "MCH/MCHRotation.cs"
          $version = "${{ steps.version.outputs.version }}"
          $content = [System.IO.File]::ReadAllText($path)
          Write-Host "File length: $($content.Length)"
          $lines = $content -split '\r?\n'
          Write-Host "Line count: $($lines.Count)"
          $found = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match 'RotationMetadata') {
              Write-Host "Found RotationMetadata at line ${i}: [$($lines[$i])]"
              if ($lines[$i] -match '\d+\.\d+\.\d+\.\d+') {
                $lines[$i] = $lines[$i] -replace '\d+\.\d+\.\d+\.\d+', $version
                Write-Host "Updated to: [$($lines[$i])]"
                $found = $true
              }
              break
            }
          }
          if (-not $found) {
            throw "Could not find or update RotationMetadata version in $path."
          }
          $lines -join [System.Environment]::NewLine | Set-Content -Path $path -Encoding UTF8 -NoNewline
          Write-Host "Version synced to $version"

      # ============================================================
      # 双版本构建：CNGL（国服 API15 / net10）+ TC（繁中服 API13 / net9）
      # 各自从 NuGet SDK 包动态读取 PromeRotation 版本与 Dalamud API 版本
      # ============================================================
      - name: Build CNGL & TC and read versions
        id: references
        shell: pwsh
        run: |
          $flavors = @('CNGL', 'TC')
          foreach ($flavor in $flavors) {
            Write-Host "===== Build flavor: $flavor ====="
            dotnet restore MCH/MCH.csproj -p:SdkFlavor=$flavor
            if ($LASTEXITCODE -ne 0) { throw "restore failed for $flavor" }
            dotnet build MCH/MCH.csproj `
              --no-restore `
              --configuration Release `
              -p:SdkFlavor=$flavor `
              -p:OutputPath="${{ runner.temp }}\publish_$($flavor.ToLowerInvariant())\" `
              -p:AppendTargetFrameworkToOutputPath=false
            if ($LASTEXITCODE -ne 0) { throw "build failed for $flavor" }

            # 从 NuGet 缓存读取该 flavor 的 SDK 包内 DLL 版本
            $pkgId = "promerotation.sdk.$($flavor.ToLowerInvariant())"
            $pkgRoot = "$HOME\.nuget\packages\$pkgId"
            $promeVersion = ""
            $dalamudApi = ""
            if (Test-Path $pkgRoot) {
              $verDir = Get-ChildItem $pkgRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
              $promeDll = Get-ChildItem "$($verDir.FullName)" -Recurse -Filter "PromeRotation.dll" | Select-Object -First 1
              $dalamudDll = Get-ChildItem "$($verDir.FullName)" -Recurse -Filter "Dalamud.dll" | Select-Object -First 1
              if ($promeDll) {
                $promeVersion = [System.Reflection.AssemblyName]::GetAssemblyName($promeDll.FullName).Version.ToString()
              }
              if ($dalamudDll) {
                # Dalamud 程序集主版本 = API 版本（如 15.0.3.1 → API15 / 13.0.0.16 → API13）
                $dalamudApi = [System.Reflection.AssemblyName]::GetAssemblyName($dalamudDll.FullName).Version.Major.ToString()
              }
            }
            if ([string]::IsNullOrEmpty($dalamudApi)) {
              $dalamudApi = "15"
            }
            $key = $flavor.ToLowerInvariant()
            "${key}_prome_version=$promeVersion" >> $env:GITHUB_OUTPUT
            "${key}_dalamud_api=$dalamudApi" >> $env:GITHUB_OUTPUT
            Write-Host "$flavor -> prome_version=$promeVersion, dalamud_api=$dalamudApi"
          }

      - name: Package zips
        shell: pwsh
        run: |
          $dist = "${{ runner.temp }}\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # 国服版：LccMch.zip
          Compress-Archive `
            -Path "${{ runner.temp }}\publish_cngl\MCH.dll", "${{ runner.temp }}\publish_cngl\MCH.deps.json" `
            -DestinationPath "$dist\LccMch.zip" `
            -Force
          # 繁中服版：LccMch-TC.zip
          Compress-Archive `
            -Path "${{ runner.temp }}\publish_tc\MCH.dll", "${{ runner.temp }}\publish_tc\MCH.deps.json" `
            -DestinationPath "$dist\LccMch-TC.zip" `
            -Force

      - name: Generate repo jsons
        shell: pwsh
        run: |
          $dist = "${{ runner.temp }}\dist"
          $version = "${{ steps.version.outputs.version }}"

          function New-Manifest($zipName, $dalamudApi, $promeVersion) {
            $sha256 = (Get-FileHash -Algorithm SHA256 -Path "$dist\$zipName").Hash.ToLowerInvariant()
            return [ordered]@{
              author = "${{ env.ACR_AUTHOR }}"
              version = $version
              description = "${{ env.ACR_DESCRIPTION }}"
              supportedJobs = @(
                [ordered]@{
                  job = "${{ env.ACR_JOB }}"
                  contentScope = "${{ env.ACR_CONTENT_SCOPE }}"
                }
              )
              apiVersion = [int]$dalamudApi
              referencePromeVersion = $promeVersion
              downloadUrl = "https://raw.githubusercontent.com/${{ github.repository }}/release/$zipName"
              sha256 = $sha256
            }
          }

          # 国服版 manifest：repo.json（UTF-8 无 BOM）
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $m1 = New-Manifest "LccMch.zip" "${{ steps.references.outputs.cngl_dalamud_api }}" "${{ steps.references.outputs.cngl_prome_version }}"
          [System.IO.File]::WriteAllText("$dist\repo.json", ($m1 | ConvertTo-Json -Depth 8), $utf8NoBom)

          # 繁中服版 manifest：repo-tc.json（UTF-8 无 BOM）
          $m2 = New-Manifest "LccMch-TC.zip" "${{ steps.references.outputs.tc_dalamud_api }}" "${{ steps.references.outputs.tc_prome_version }}"
          [System.IO.File]::WriteAllText("$dist\repo-tc.json", ($m2 | ConvertTo-Json -Depth 8), $utf8NoBom)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ${{ runner.temp }}\dist\LccMch.zip
            ${{ runner.temp }}\dist\LccMch-TC.zip
            ${{ runner.temp }}\dist\repo.json
            ${{ runner.temp }}\dist\repo-tc.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            ${{ runner.temp }}\dist\LccMch.zip
            ${{ runner.temp }}\dist\LccMch-TC.zip
            ${{ runner.temp }}\dist\repo.json
            ${{ runner.temp }}\dist\repo-tc.json

      - name: Publish stable download branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: release
          publish_dir: ${{ runner.temp }}\dist
          force_orphan: true
